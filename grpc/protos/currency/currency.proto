syntax = "proto3";

// an rpc based service called GetRate using a RateRequest message to return a RateResponse
package currency;
option go_package = "protos/currency;currency";

service Currency {
    rpc GetRate(RateRequest) returns (RateResponse);
}

message RateRequest {
    string Base = 1;
    string Destination = 2;
}

message RateResponse {
    float Rate = 1;
}

